[project]
name = "django-sql-compiler"
version = "0.2.0"
description = "A light-weight module to generate usable SQL from a Django QuerySet."
readme = "README.md"
authors = [
    { name = "Grok Data / Jared Stufft", email = "jared@grokdata.tech" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/JaredStufftGD/django-sql-compiler"
Source = "https://github.com/JaredStufftGD/django-sql-compiler"
Changelog = "https://github.com/JaredStufftGD/django-sql-compiler/blob/master/CHANGELOG.md"
Issues = "https://github.com/JaredStufftGD/django-sql-compiler/issues"

[dependency-groups]
dev = [
    "pytest>=8",
]
pg2 = [
    "psycopg2-binary>=2.9.9",
]
pg3 = [
    "psycopg[binary]>=3.2",
]
mysql = [
    "mysqlclient>=2.2.1",
]

[tool.uv]
conflicts = [
    [{ group = "pg2" }, { group = "pg3" }],
]

[build-system]
requires = ["flit_core>=4,<5"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "sql_compiler"

[tool.flit.sdist]
include = ["CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = "-ra"
